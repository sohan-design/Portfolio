  <script>
    (function () {
      var el = document.getElementById('introLoader');
      if (!el) return;
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { el.remove(); return; }
      var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var type = nav ? nav.type : 'navigate';
      var seen = false;
      try { seen = sessionStorage.getItem('introLoaderSeen') === '1'; } catch (e) {}
      // Play on hard reload, or first visit in this tab. Skip in-app navigations.
      if (!(type === 'reload' || (type === 'navigate' && !seen))) {
        el.remove();
        return;
      }
      try { sessionStorage.setItem('introLoaderSeen', '1'); } catch (e) {}
      document.body.classList.add('intro-loading');
    })();
  </script>
