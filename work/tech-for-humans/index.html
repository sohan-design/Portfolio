  <script>
    (function () {
      try {
        var t = localStorage.getItem('portfolio-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
</head>

  <header class="tfh-chrome">

  </header>

  <main class="tfh-stage" aria-label="Tech for humans infinite canvas">
    <div class="hp2-infinite-canvas tfh-canvas" data-infinite-canvas role="img" aria-label="Drag to explore the Tech for humans image grid">
      <canvas></canvas>
    </div>
  </main>

  <script type="module" src="/src/js/main.js"></script>
